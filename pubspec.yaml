name: wenkikly
description: Asisten AI Wenkikly.
publish_to: 'none'
version: 1.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_markdown: ^0.6.18
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_launcher_icons: ^0.13.1
  flutter_tts: ^3.8.3
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Konfigurasi Logo Baru (new_logo.png)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "new_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
