name: wenkikly
description: Asisten AI Wenkikly Pro.
publish_to: 'none'
version: 4.0.0+40

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_markdown: ^0.6.18
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_launcher_icons: ^0.13.1
