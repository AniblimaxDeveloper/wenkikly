name: wenkikly
description: Asisten AI Wenkikly Pro.
publish_to: 'none'
version: 3.3.0+21

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_markdown: ^0.6.18
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_launcher_icons: ^0.13.1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  share_plus: ^7.2.2
  local_auth: ^2.1.8
  url_launcher: ^6.2.5
  path_provider: ^2.1.3
  image_picker: ^1.0.7
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "new_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
